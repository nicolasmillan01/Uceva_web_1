
<div class="auth-page">
  <div class="row g-0 min-vh-100">

    <!-- Panel informativo -->
    <div class="col-lg-6 d-none d-lg-flex auth-info">
      <div class="auth-info-content">
        <h1>EventApp</h1>
        <p>
          Gestiona tus eventos, reservas y experiencias
          desde un solo lugar.
        </p>
      </div>
    </div>

    <!-- Formulario de autenticación -->
    <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center">
      <div class="auth-card">

        <div class="text-center mb-4">
          <h2>Iniciar sesión</h2>
          <p class="text-muted">
            Ingresa tus credenciales para continuar
          </p>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm">

          <!-- Correo electrónico -->
          <div class="mb-3">
            <label for="email" class="form-label">
              Correo electrónico
            </label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="correo@ejemplo.com"
              [(ngModel)]="email"
              required
              email
            >
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Ingresa tu contraseña"
              [(ngModel)]="password"
              required
            >
          </div>

          <!-- Mensaje de error -->
          @if (errorMessage()) {
            <div class="alert alert-danger" role="alert">
              {{ errorMessage() }}
            </div>
          }

          <!-- Iniciar sesión -->
          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="loading() || loginForm.invalid"
          >
            @if (loading()) {
              Iniciando sesión...
            } @else {
              Iniciar sesión
            }
          </button>

        </form>

        <!-- Enlace al registro -->
        <div class="text-center mt-4">
          <span class="text-muted">
            ¿No tienes una cuenta?
          </span>

          <a
            routerLink="/register"
            class="auth-link"
          >
            Crear cuenta
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
