
<div class="auth-page">
  <div class="row g-0 min-vh-100">

    <!-- Panel informativo -->
    <div class="col-lg-5 d-none d-lg-flex auth-info">
      <div class="auth-info-content">
        <h1>Únete a EventApp</h1>

        <p>
          Crea tu cuenta y comienza a gestionar
          tus eventos y reservas.
        </p>
      </div>
    </div>

    <!-- Formulario -->
    <div
      class="col-12 col-lg-7 d-flex align-items-center justify-content-center py-5"
    >
      <div class="auth-card">

        <div class="text-center mb-4">
          <h2>Crear cuenta</h2>

          <p class="text-muted">
            Completa la información para registrarte
          </p>
        </div>

        <!-- Mensajes -->
        @if (errorMessage()) {
          <div class="alert alert-danger" role="alert">
            {{ errorMessage() }}
          </div>
        }

        @if (successMessage()) {
          <div class="alert alert-success" role="status">
            {{ successMessage() }}
          </div>
        }

        <form #registerForm="ngForm"
              (ngSubmit)="register()">

          <!-- Nombre completo -->
          <div class="mb-3">
            <label for="fullName" class="form-label">
              Nombre completo
            </label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-control"
              placeholder="Ej. Juan Pérez"
              [(ngModel)]="nombre"
              required
            >
          </div>

          <!-- Correo electrónico -->
          <div class="mb-3">
            <label for="email" class="form-label">
              Correo electrónico
            </label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="correo@ejemplo.com"
              [(ngModel)]="email"
              required
              email
            >
          </div>

          <!-- País -->
          <div class="mb-3">
            <label for="country" class="form-label">
              País
            </label>

            <select
              id="country"
              name="country"
              class="form-select"
              [(ngModel)]="country_id"
              (ngModelChange)="onCountryChange()"
              required
            >
              <option [ngValue]="null">
                Selecciona tu país
              </option>

              @for (country of countries; track country.id) {
                <option [ngValue]="country.id">
                  {{ country.nombre }}
                </option>
              }
            </select>
          </div>

          <!-- Departamento -->
          <div class="mb-3">
            <label for="department" class="form-label">
              Departamento
            </label>

            <select
              id="department"
              name="department"
              class="form-select"
              [(ngModel)]="department_id"
              (ngModelChange)="onDepartmentChange()"
              [disabled]="country_id === null"
              required
            >
              <option [ngValue]="null">
                Selecciona tu departamento
              </option>

              @for (department of departments; track department.id) {
                <option [ngValue]="department.id">
                  {{ department.nombre }}
                </option>
              }
            </select>
          </div>

          <!-- Ciudad -->
          <div class="mb-3">
            <label for="city" class="form-label">
              Ciudad
            </label>

            <select
              id="city"
              name="city"
              class="form-select"
              [(ngModel)]="city_id"
              [disabled]="department_id === null"
              required
            >
              <option [ngValue]="null">
                Selecciona tu ciudad
              </option>

              @for (city of cities; track city.id) {
                <option [ngValue]="city.id">
                  {{ city.nombre }}
                </option>
              }
            </select>
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Mínimo 8 caracteres"
              [(ngModel)]="password"
              minlength="8"
              maxlength="128"
              required
            >
          </div>

          <!-- Confirmar contraseña -->
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">
              Confirmar contraseña
            </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-control"
              placeholder="Repite tu contraseña"
              [(ngModel)]="confirmPassword"
              required
            >
          </div>

          <!-- Registrar -->
          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="loading() || registerForm.invalid"
          >
            @if (loading()) {
              Registrando...
            } @else {
              Registrar
            }
          </button>

        </form>

        <!-- Login -->
        <div class="text-center mt-4">
          <span class="text-muted">
            ¿Ya tienes una cuenta?
          </span>

          <a routerLink="/login" class="auth-link">
            Iniciar sesión
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
